# EVALUATION ONLY: unresolved image scan findings; see REVIEW.md.
# Standalone NAS deployment; do not combine with upstream Compose files.
name: paca-synology
x-common: &common
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  networks: [backend]

services:
  postgres:
    <<: *common
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    mem_limit: 512m
    shm_size: 128m
    environment:
      POSTGRES_DB: paca
      POSTGRES_USER: paca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init.sh}
    volumes: ["./state/postgres:/var/lib/postgresql/data"]
    healthcheck:
      # The first-start temporary server listens only on the Unix socket.
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U paca -d paca"]
      interval: 10s
      timeout: 5s
      retries: 20

  valkey:
    <<: *common
    image: valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    mem_limit: 1g
    # Fail writes at capacity instead of evicting queue/stream data.
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD}
    command:
      - sh
      - -ec
      - exec valkey-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass "$$VALKEY_PASSWORD"
    volumes: ["./state/valkey:/data"]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 20

  rustfs-init:
    image: rustfs/rustfs:1.0.0-rc.6@sha256:97171b3d72cd47dc81000f92ea84de25608bfc35a94c965501afaeb5d99f6035
    user: "0:0"
    entrypoint: [/bin/sh, -c, "chown -R 10001:10001 /data/rustfs0"]
    restart: "no"
    security_opt: [no-new-privileges:true]
    network_mode: none
    mem_limit: 128m
    volumes: ["./state/rustfs:/data/rustfs0"]

  rustfs:
    <<: *common
    image: rustfs/rustfs:1.0.0-rc.6@sha256:97171b3d72cd47dc81000f92ea84de25608bfc35a94c965501afaeb5d99f6035
    mem_limit: 1536m
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY_ID:?Run scripts/init.sh}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_ACCESS_KEY:?Run scripts/init.sh}
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes: ["./state/rustfs:/data/rustfs0"]
    depends_on:
      rustfs-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/health]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    <<: *common
    image: paca-api-local:0.20.2-local.1-amd64
    pull_policy: never
    mem_limit: 512m
    environment:
      ENV: production
      PORT: "8080"
      GOMEMLIMIT: 384MiB
      DATABASE_URL: postgres://paca:${POSTGRES_PASSWORD:?Run scripts/init.sh}@postgres:5432/paca?sslmode=disable
      REDIS_URL: redis://:${VALKEY_PASSWORD:?Set VALKEY_PASSWORD}@valkey:6379/0
      JWT_SECRET: ${JWT_SECRET:?Run scripts/init.sh}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 168h
      COOKIE_SECURE: "true"
      AUTH_RATE_LIMIT_PER_MINUTE: "10"
      TRUSTED_PROXY_HOPS: "1"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-pacaadmin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run scripts/init.sh}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run scripts/init.sh}
      AI_AGENT_INTERNAL_KEY: ${INTERNAL_API_KEY:?Run scripts/init.sh}
      AI_AGENT_URL: http://127.0.0.1:9
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      CORS_ORIGINS: ${PUBLIC_URL:?Set PUBLIC_URL}
      GIT_WEBHOOK_PUBLIC_URL: ${GIT_WEBHOOK_PUBLIC_URL:-}
      STORAGE_PROVIDER: rustfs
      STORAGE_ENDPOINT: rustfs:9000
      STORAGE_PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}/storage
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: paca
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?Run scripts/init.sh}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?Run scripts/init.sh}
      STORAGE_USE_SSL: "false"
      PLUGINS_WASM_DIR: /plugins
      PLUGINS_FRONTEND_DIR: /plugins-frontend
      PLUGINS_MCP_DIR: /plugins-mcp
      PLUGINS_SKILLS_DIR: /plugins-skills
    volumes:
      - ./state/plugins/backend:/plugins
      - ./state/plugins/frontend:/plugins-frontend
      - ./state/plugins/mcp:/plugins-mcp
      - ./state/plugins/skills:/plugins-skills
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_healthy}
      rustfs: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:8080/api/healthz]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    <<: *common
    image: pacaai/paca-web:0.20.2@sha256:d71c6eec583073186982a74e40db26ee69a1111c12b7dc29883a821f6bf90ad8
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    # The upstream Caddy executable carries this file capability.
    cap_add: [NET_BIND_SERVICE]
    tmpfs: [/tmp, /data, /config]
    depends_on:
      api: {condition: service_healthy}

  realtime:
    <<: *common
    image: pacaai/paca-realtime:0.20.2@sha256:b11009ace9fa50718275c20d2f28e62b861bc7e9c1563d0a9718777091088bf5
    mem_limit: 256m
    cap_drop: [ALL]
    environment:
      PORT: "3001"
      NODE_ENV: production
      API_URL: http://api:8080
      REDIS_URL: redis://:${VALKEY_PASSWORD:?Set VALKEY_PASSWORD}@valkey:6379/0
      CORS_ORIGINS: ${PUBLIC_URL:?Set PUBLIC_URL}
      LOG_LEVEL: info
    depends_on:
      api: {condition: service_healthy}
      valkey: {condition: service_healthy}

  gateway:
    <<: *common
    init: true
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    mem_limit: 128m
    networks: [backend, edge]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "${NAS_BIND_IP:?Set a private NAS LAN IPv4}:${PACA_PORT:-8443}:443/tcp"
    environment:
      PACA_HOST: ${PACA_HOST:?Set local hostname or NAS IPv4}
      LAN_CIDR: ${LAN_CIDR:?Set trusted LAN CIDR}
      PACA_DOCKER_GATEWAY: ${PACA_DOCKER_GATEWAY:-127.0.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./state/plugins/frontend:/var/www/plugins:ro
      - ./state/plugins/mcp:/var/www/plugins-mcp:ro
      - ./state/plugins/skills:/var/www/plugins-skills:ro
      - ./state/caddy/data:/data
      - ./state/caddy/config:/config
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
      realtime: {condition: service_started}

networks:
  backend:
    internal: true
  edge:
    driver: bridge
