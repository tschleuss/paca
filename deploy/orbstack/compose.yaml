# Local OrbStack deployment. Runtime has no new outbound network access.
# Application pins: images.lock.json; baseline review: ../synology/REVIEW.md.
name: paca-orbstack
x-common: &common
  restart: "no"
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  network_mode: service:network-guard
  cap_drop: [ALL]
  cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
  pids_limit: 256

services:
  network-guard:
    image: paca-orbstack-tools:1
    build: {context: ., dockerfile: Dockerfile}
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETPCAP]
    read_only: true
    tmpfs: [/run, /tmp]
    mem_limit: 64m
    pids_limit: 32
    networks: [guarded]
    # Never forward queries to the Mac's DNS resolver.
    dns: [127.0.0.1]
    ports: ["127.0.0.1:${PACA_PORT:-8443}:443/tcp"]
    healthcheck:
      test: [CMD, test, -f, /run/firewall-ready]
      interval: 2s
      timeout: 2s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  postgres:
    <<: *common
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      network-guard: {condition: service_healthy}
    shm_size: 128m
    environment:
      POSTGRES_DB: paca
      POSTGRES_USER: paca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 paca.py init}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U paca -d paca"]
      interval: 10s
      timeout: 5s
      retries: 20

  valkey:
    <<: *common
    image: valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    mem_limit: 256m
    cpus: 0.5
    # Fail writes at capacity instead of evicting queue/stream data.
    depends_on:
      network-guard: {condition: service_healthy}
    command: [valkey-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes: ["valkey_data:/data"]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 20


  rustfs:
    <<: *common
    image: rustfs/rustfs:1.0.0-rc.6@sha256:97171b3d72cd47dc81000f92ea84de25608bfc35a94c965501afaeb5d99f6035
    cap_add: []
    mem_limit: 1536m
    cpus: 1.0
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY_ID:?Run python3 paca.py init}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_ACCESS_KEY:?Run python3 paca.py init}
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes: ["rustfs_data:/data/rustfs0"]
    depends_on:
      network-guard: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/health]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    <<: *common
    image: pacaai/paca-api:0.19.2@sha256:0012535146762552effd1843657bdffbe13c10164c583d95800d9aeb065ceda3
    mem_limit: 512m
    cpus: 1.0
    environment:
      ENV: production
      PORT: "8080"
      GOMEMLIMIT: 384MiB
      DATABASE_URL: postgres://paca:${POSTGRES_PASSWORD:?Run python3 paca.py init}@127.0.0.1:5432/paca?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ${JWT_SECRET:?Run python3 paca.py init}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 168h
      COOKIE_SECURE: "true"
      AUTH_RATE_LIMIT_PER_MINUTE: "10"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-pacaadmin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run python3 paca.py init}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run python3 paca.py init}
      AI_AGENT_INTERNAL_KEY: ${INTERNAL_API_KEY:?Run python3 paca.py init}
      AI_AGENT_URL: http://127.0.0.1:9
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      CORS_ORIGINS: ${PUBLIC_URL:?Set PUBLIC_URL}
      STORAGE_PROVIDER: rustfs
      STORAGE_ENDPOINT: 127.0.0.1:9000
      STORAGE_PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}/storage
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: paca
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?Run python3 paca.py init}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?Run python3 paca.py init}
      STORAGE_USE_SSL: "false"
      PLUGINS_WASM_DIR: /plugins
      PLUGINS_FRONTEND_DIR: /plugins-frontend
      PLUGINS_MCP_DIR: /plugins-mcp
      PLUGINS_SKILLS_DIR: /plugins-skills
    volumes:
      - backend_plugins:/plugins
      - frontend_plugins:/plugins-frontend
      - mcp_plugins:/plugins-mcp
      - skills_plugins:/plugins-skills
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_healthy}
      rustfs: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:8080/api/healthz]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  web:
    <<: *common
    image: pacaai/paca-web:0.19.2@sha256:b9c6ae286ecc90cda5a48bab668cda7a05820ddecd71d5fdcfc12787a831ecbc
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    # The upstream Caddy executable carries this file capability.
    cap_add: [NET_BIND_SERVICE]
    tmpfs: [/tmp, /data, /config]
    depends_on:
      api: {condition: service_healthy}

  realtime:
    <<: *common
    image: pacaai/paca-realtime:0.19.2@sha256:7f38eb04f0e7a60a57bae91f936a06c32243599e7a88892fb12e856b8945c1c2
    mem_limit: 256m
    cpus: 0.5
    cap_drop: [ALL]
    cap_add: []
    environment:
      PORT: "3001"
      NODE_ENV: production
      API_URL: http://127.0.0.1:8080
      REDIS_URL: redis://127.0.0.1:6379/0
      CORS_ORIGINS: ${PUBLIC_URL:?Set PUBLIC_URL}
      LOG_LEVEL: info
    depends_on:
      api: {condition: service_healthy}
      valkey: {condition: service_healthy}

  gateway:
    <<: *common
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    # BusyBox wget's HTTPS helper can outlive a probe. Reap adopted ssl_client
    # children instead of letting zombies consume the container's task limit.
    init: true
    mem_limit: 128m
    cpus: 0.5
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: [CMD, wget, -q, --no-check-certificate, --spider, https://localhost/api/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      PACA_HOST: localhost
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_plugins:/var/www/plugins:ro
      - mcp_plugins:/var/www/plugins-mcp:ro
      - skills_plugins:/var/www/plugins-skills:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
      realtime: {condition: service_started}

  backup:
    image: paca-orbstack-tools:1
    profiles: [maintenance]
    network_mode: none
    restart: "no"
    entrypoint: []
    command: ["true"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH, DAC_OVERRIDE, CHOWN, FOWNER]
    read_only: true
    # Archive extraction restores parent-directory metadata as well as volume
    # contents; writable tmpfs parents keep the rest of the helper read-only.
    tmpfs: [/tmp, "/snapshot:size=1m,mode=0755"]
    mem_limit: 256m
    volumes:
      - postgres_data:/snapshot/postgres
      - valkey_data:/snapshot/valkey
      - rustfs_data:/snapshot/rustfs
      - backend_plugins:/snapshot/plugins/backend
      - frontend_plugins:/snapshot/plugins/frontend
      - mcp_plugins:/snapshot/plugins/mcp
      - skills_plugins:/snapshot/plugins/skills
      - caddy_data:/snapshot/caddy/data
      - caddy_config:/snapshot/caddy/config
      - ./backups:/work
      - ./secrets:/keys

networks:
  guarded:
    # OrbStack does not publish ports on internal-only networks. The namespace
    # firewall is the egress boundary; no app ever gets NET_ADMIN.
    driver: bridge
    enable_ipv6: false

volumes:
  postgres_data:
  valkey_data:
  rustfs_data:
  backend_plugins:
  frontend_plugins:
  mcp_plugins:
  skills_plugins:
  caddy_data:
  caddy_config:
